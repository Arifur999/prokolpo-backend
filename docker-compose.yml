# Local development: `docker compose up -d db` for the database alone, or
# `docker compose --profile app up --build` to run the API in a container too.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: prokolpo
      POSTGRES_PASSWORD: prokolpo
      POSTGRES_DB: prokolpo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prokolpo -d prokolpo"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: [app]
    build: .
    entrypoint: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://prokolpo:prokolpo@db:5432/prokolpo?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://prokolpo:prokolpo@db:5432/prokolpo?sslmode=disable
      LOG_LEVEL: debug
    ports:
      - "5000:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
